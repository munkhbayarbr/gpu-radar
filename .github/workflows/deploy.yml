name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live offers
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python3 scripts/fetch_offers.py

      - name: Commit price history
        run: |
          git config user.name "gpu-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: price history [skip ci]"
            git push || echo "push skipped (concurrent run won the race)"
          fi

      - name: Build site
        run: python3 scripts/build_pages.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
